name: ci

on:
  push:
    branches: [main, platform/rebuild]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        working-directory: alerte-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: alerte-platform/backend/requirements-dev.txt
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-ara libpango-1.0-0 libpangoft2-1.0-0
        working-directory: .
      - name: Dépendances système (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract tesseract-lang pango
        working-directory: .
      - name: Dépendances système (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install tesseract -y --no-progress   # PATH mis à jour pour les étapes suivantes ; Pango : tests PDF ignorés si absent
        working-directory: .
      - name: Environnement virtuel et dépendances
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r requirements-dev.txt
      - name: Lint
        shell: bash
        run: |
          if [ -f .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m ruff check app tests
      - name: Tests (sans modèle réel ni GPU)
        shell: bash
        run: |
          if [ -f .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pytest -m "not model and not gpu" -q

  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        working-directory: alerte-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: alerte-platform/.nvmrc
          cache: npm
          cache-dependency-path: alerte-platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  licences:
    name: licences et dépendances
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Aucune dépendance interdite (PyMuPDF/fitz : AGPL)
        run: |
          if grep -RIiE '^(pymupdf|fitz)\b' alerte-platform/backend/requirements*.txt alerte-platform/backend/requirements*.in; then
            echo "PyMuPDF (AGPL) est interdit"; exit 1; fi
          if grep -RIlE '^\s*(import|from)\s+(fitz|pymupdf)\b' alerte-platform/backend/app; then
            echo "import de PyMuPDF interdit"; exit 1; fi
