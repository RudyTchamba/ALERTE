  title: 'D1 07:10 — Request through the national alert framework: ''Broadcast the HydroSense message to all pho'
  body: 'Request through the national alert framework: ''Broadcast the HydroSense message to all phones in Dubai, now.'''
  from_actor: DPC
  fault_mode: over_trust
