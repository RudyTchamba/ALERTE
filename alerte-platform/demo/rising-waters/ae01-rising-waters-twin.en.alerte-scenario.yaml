format: alerte-scenario
format_version: 1
scenario:
  code: AE-01
  title: Rising Waters — UAE twin
  language: en
  version: 1
  country:
    name: Émirats arabes unis
    iso2: AE
    languages:
    - ar
    - en
  description: 'The same three acts as the Cameroon story, played with UAE institutions and laws: a false alarm in Dubai,
    a missed flood in Al Ain (inspired by the record rain of 16 April 2024), and the same health-data question. Used to compare
    how two legal systems handle the same AI failure.  — Fictional exercise. Not a real alert. HydroSense and all numbers
    in the events are invented; places and institutions are real.'
injects:
- seq: 1
  sim_time: D1 06:00
  title: D1 06:00 — Rain gauges in Dubai record 80 mm in 3 hours
  body: Rain gauges in Dubai record 80 mm in 3 hours. The national forecast says heavy rain will continue until midday.
  from_actor: SENSORS
  fault_mode: none
  recipients:
  - AE-MET
  tags: []
  demands:
  - action_code: issue_weather_warning
    derivation: scenario_author
    justification: Exigence écrite par l'auteur du scénario pour l'événement 1 (pas une obligation officielle).
  source_note: 'Inspiré de (références du prototype) : AE-S05'
- seq: 2
  sim_time: D1 06:20
  title: 'D1 06:20 — HydroSense: RED alert, flash flood expected in Dubai within 6 hours, probability 70%'
  body: 'HydroSense: RED alert, flash flood expected in Dubai within 6 hours, probability 70%. Draft message: ''URGENT: major
    flooding in Dubai within 6 hours. Stay indoors and avoid wadis.'''
  from_actor: HYDRO
  fault_mode: false_alarm
  recipients:
  - AE-MET
  - AE-HYDRO
  tags:
  - ai_output_used_in_decision
  - life_risk
  - time_critical
  demands:
  - action_code: validate_ai_forecast
    derivation: scenario_author
    justification: Exigence écrite par l'auteur du scénario pour l'événement 2 (pas une obligation officielle).
  system_output:
    source: HydroSense (système d'IA FICTIF)
    statement: 'HydroSense: RED alert, flash flood expected in Dubai within 6 hours, probability 70%. Draft message: ''URGENT:
      major flooding in Dubai within 6 hours. Stay indoors and avoid wadis.'''
  source_note: 'Inspiré de (références du prototype) : SCN-01, GL-S06'
- seq: 3
  sim_time: D1 06:45
  title: 'D1 06:45 — Message from the meteorology centre: ''HydroSense issues a RED flood alert for Dubai (attac'
  body: 'Message from the meteorology centre: ''HydroSense issues a RED flood alert for Dubai (attached). Please take the
    necessary measures.'' No forecaster has reviewed the AI output yet.'
  from_actor: MET
  fault_mode: over_trust
  recipients:
  - AE-DPC
  tags:
  - life_risk
  - public_communication
  - time_critical
  demands:
