- seq: 10
  sim_time: D11 11:30
  title: D11 11:30 — The alert is approved and sent by SMS, in French only
  body: The alert is approved and sent by SMS, in French only. About 30% of the affected area has no mobile coverage; many
    residents speak Arabic Choa, Fulfulde or Kotoko.
  from_actor: DPC
  fault_mode: language_error
