  title: 'D11 09:00 — A village chief near Kousseri calls the council: ''The water is rising fast, people are mov'
  body: 'A village chief near Kousseri calls the council: ''The water is rising fast, people are moving to the school.'' The
    AI still says low risk.'
  from_actor: FIELD
  fault_mode: missed_event
  recipients:
