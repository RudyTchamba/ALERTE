  - action_code: send_mass_alert
    derivation: scenario_author
    justification: Exigence écrite par l'auteur du scénario pour l'événement 4 (pas une obligation officielle).
  source_note: 'Inspiré de (références du prototype) : CM-S03, GL-S04, GL-S01'
- seq: 5
  sim_time: D1 08:30
  title: 'D1 08:30 — Réseaux sociaux : panique à Douala apres le SMS'
  body: 'Réseaux sociaux : panique à Douala apres le SMS. Embouteillages sur les grands axes ; 14 blesses dans une bousculade
    près d''un marché. Des familles demandent qui paiera les frais médicaux.'
  from_actor: MEDIA
  fault_mode: false_alarm
  recipients:
