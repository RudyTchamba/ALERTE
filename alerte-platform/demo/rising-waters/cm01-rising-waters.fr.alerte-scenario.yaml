format: alerte-scenario
format_version: 1
scenario:
  code: CM-01
  title: Rising Waters — Cameroun
  language: fr
  version: 1
  country:
    name: Cameroun
    iso2: CM
    languages:
    - fr
    - en
  description: 'A fictional AI system, HydroSense, forecasts floods and drafts alerts. Act 1 (Douala): a false alarm sent
    to every phone. Act 2 (Far North): a missed flood because sensors were down, a French-only alert, areas without coverage.
    Act 3: cholera, a request for phone location data, and a vendor processing data abroad.  — Fictional exercise. Not a real
    alert. HydroSense and all numbers in the events are invented; places and institutions are real.'
injects:
- seq: 1
  sim_time: D1 06:00
  title: D1 06:00 — Les pluviomètres de Douala enregistrent 80 mm en 3 heures
  body: Les pluviomètres de Douala enregistrent 80 mm en 3 heures. La prévision nationale annonce de fortes pluies jusqu'à
    midi.
  from_actor: SENSORS
  fault_mode: none
  recipients:
  - MET
  tags: []
  demands:
  - action_code: issue_weather_warning
    derivation: scenario_author
    justification: Exigence écrite par l'auteur du scénario pour l'événement 1 (pas une obligation officielle).
  source_note: 'Inspiré de (références du prototype) : CM-S07'
- seq: 2
  sim_time: D1 06:20
  title: 'D1 06:20 — HydroSense : alerte ROUGE, crue du Wouri attendue dans 6 heures, probabilité 70 %'
  body: 'HydroSense : alerte ROUGE, crue du Wouri attendue dans 6 heures, probabilité 70 %. Projet de SMS : ''URGENT : grave
    inondation à Douala dans 6 heures. Rejoignez immédiatement les hauteurs.'''
  from_actor: HYDRO
  fault_mode: false_alarm
  recipients:
  - MET
  - HYDRO
  tags:
  - ai_output_used_in_decision
  - life_risk
  - time_critical
  demands:
  - action_code: validate_ai_forecast
    derivation: scenario_author
    justification: Exigence écrite par l'auteur du scénario pour l'événement 2 (pas une obligation officielle).
  system_output:
    source: HydroSense (système d'IA FICTIF)
    statement: 'HydroSense : alerte ROUGE, crue du Wouri attendue dans 6 heures, probabilité 70 %. Projet de SMS : ''URGENT
      : grave inondation à Douala dans 6 heures. Rejoignez immédiatement les hauteurs.'''
  source_note: 'Inspiré de (références du prototype) : SCN-01, GL-S06'
- seq: 3
  sim_time: D1 06:45
  title: 'D1 06:45 — Courriel du service météorologique : ''HydroSense emet une alerte ROUGE inondation pour Dou'
  body: 'Courriel du service météorologique : ''HydroSense emet une alerte ROUGE inondation pour Douala (ci-jointe). Merci
    de prendre les mesures nécessaires.'' Aucun prévisionniste n''a encore vérifié le résultat de l''IA.'
  from_actor: MET
  fault_mode: over_trust
  recipients:
  - DPC
  tags:
  - life_risk
  - public_communication
  - time_critical
  demands:
  - action_code: decide_public_alert
    derivation: scenario_author
    justification: Exigence écrite par l'auteur du scénario pour l'événement 3 (pas une obligation officielle).
  source_note: 'Inspiré de (références du prototype) : CM-S01'
- seq: 4
  sim_time: D1 07:10
  title: 'D1 07:10 — Appel de la protection civile : ''Envoyez tout de suite le SMS de HydroSense à tous les num'
  body: 'Appel de la protection civile : ''Envoyez tout de suite le SMS de HydroSense à tous les numéros de Douala.'' Aucun
    ordre écrit, aucune référence juridique, rien sur le coût.'
  from_actor: DPC
  fault_mode: over_trust
  recipients:
  - OPS
  tags:
  - life_risk
  - public_communication
  - time_critical
  demands:
