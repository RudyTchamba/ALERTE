  title: D1 12:00 — Aucune inondation
  body: Aucune inondation. Le Wouri reste a un niveau normal. Des journalistes demandent qui a envoyé le SMS et pourquoi aucun
    correctif n'a été envoyé.
  from_actor: MEDIA
  fault_mode: false_alarm
  recipients:
