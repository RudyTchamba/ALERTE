# Machine APPLICATIVE : API + interface + base SQLite + stockage. Les modèles d'IA sont ailleurs (ou sur la même machine) et se joignent par URL.
#
#   cd alerte-platform
#   cp deploy/env.app.example deploy/.env.app        # puis renseigner les URL des modèles (jamais commité)
#   docker compose -f deploy/compose.app.yml --env-file deploy/.env.app up -d --build
#   curl http://localhost:8000/api/v1/health
#
# Modèles sur la MÊME machine (Ollama sur l'hôte) : ALERTE_LLM_BASE_URL=http://host.docker.internal:11434/v1
# Modèles sur une AUTRE machine : l'URL ou l'IP de cette machine (ou un tunnel SSH : voir docs/deploiement/aws-sandbox.md).
services:
  alerte:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    image: alerte-app:local
    ports:
      - "${ALERTE_PORT:-8000}:8000"
    env_file:
      - .env.app
    environment:
      ALERTE_DATA_DIR: /data
    volumes:
      - alerte-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux : permet de joindre un Ollama installé sur l'hôte (Docker Desktop le fournit déjà)
    restart: unless-stopped
volumes:
  alerte-data:
