# Ready-made global examples for each action (gap topic). The precedent finder uses these first,
# then searches the global collection for more. Every entry points to a document in the library.
by_action:
  compel_operator_alert:
    - {jurisdiction: European Union, instrument: "Directive (EU) 2018/1972 (European Electronic Communications Code)", article: "Article 110", doc_id: GL-S01, url: "https://eur-lex.europa.eu/eli/dir/2018/1972/oj",
       what_it_does: "Mobile operators must relay public warnings from the national public warning system to the end-users concerned.",
       fit_note: "A decree or ART decision could create the same duty; Cameroon would need to name the authority that originates the warning."}
    - {jurisdiction: Philippines, instrument: "Republic Act No. 10639, Free Mobile Disaster Alerts Act (2014)", article: "Sections 4 and 6", doc_id: GL-S04, url: "https://issuances-library.senate.gov.ph/sites/default/files/2023-02/ra%252010639.pdf",
       what_it_does: "Operators must send free alerts with content from named agencies; fines and franchise suspension for non-compliance.",
       fit_note: "Close to Cameroon's situation (a developing country with frequent hazards); requires naming content providers and setting penalties."}
    - {jurisdiction: United States, instrument: "47 CFR Part 10 (Wireless Emergency Alerts) and WARN Act", article: "Part 10", doc_id: GL-S05, url: "https://www.ecfr.gov/current/title-47/chapter-I/subchapter-A/part-10",
       what_it_does: "Separates who originates alerts (authorised authorities), the national gateway, and the operators who transmit them.",
       fit_note: "Participation is voluntary in the US; a mandatory duty (EU, Philippines) may suit Cameroon better."}
  send_mass_alert:
    - {jurisdiction: Mauritius, instrument: "Common Alerting Protocol adoption (2023)", doc_id: GL-S08, url: "https://www.preventionweb.net/quick/96844",
       what_it_does: "One alert created once and shared across TV, radio, SMS, apps, sirens and social media by three coordinated agencies.",
       fit_note: "An African example; requires an agreed alert format and roles between the weather service, disaster agency and regulator.", binding: false}
    - {jurisdiction: International, instrument: "Recommendation ITU-T X.1303 (CAP 1.2)", doc_id: GL-S10, url: "https://www.itu.int/rec/T-REC-X.1303",
       what_it_does: "Standard format for alerts, with status, urgency, severity, area, several languages, and update or cancel messages.",
       fit_note: "Free to adopt; supported by ITU under Early Warnings for All.", binding: false}
  validate_ai_forecast:
    - {jurisdiction: European Union, instrument: "Regulation (EU) 2024/1689 (AI Act)", article: "Articles 14 and 26", doc_id: GL-S02, url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj",
       what_it_does: "High-risk AI must allow effective human oversight, guard against over-reliance, and deployers must assign competent people to oversee it.",
       fit_note: "Cameroon could require a named forecaster to validate AI forecasts before public use, without adopting the whole AI Act."}
    - {jurisdiction: United States, instrument: "FCC findings on the Hawaii false missile alert (2018)", doc_id: GL-S06, url: "https://www.fcc.gov/node/215906",
       what_it_does: "Recommended second-person verification before any live alert is released.",
       fit_note: "A simple procedure rule, cheap to adopt.", binding: false}
    - {jurisdiction: United States, instrument: "NIST AI Risk Management Framework 1.0", doc_id: GL-S12, url: "https://www.nist.gov/itl/ai-risk-management-framework",
       what_it_does: "Govern, map, measure and manage AI risks, including validity conditions and monitoring.",
       fit_note: "Voluntary method usable by a ministry before switching on an AI system.", binding: false}
  report_sensor_outage:
    - {jurisdiction: European Union, instrument: "Regulation (EU) 2024/1689 (AI Act)", article: "Articles 12 and 13", doc_id: GL-S02, url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj",
       what_it_does: "Automatic logging and instructions describing accuracy, limits and the conditions under which the system works as intended.",
       fit_note: "A purchase contract can require the vendor to show data-quality warnings on the dashboard."}
    - {jurisdiction: United States, instrument: "NIST AI Risk Management Framework 1.0", doc_id: GL-S12, url: "https://www.nist.gov/itl/ai-risk-management-framework",
       what_it_does: "Measure and monitor AI systems in operation, including data quality.", fit_note: "Voluntary method.", binding: false}
  correct_false_alert:
    - {jurisdiction: United States, instrument: "FCC findings on the Hawaii false missile alert (2018)", doc_id: GL-S06, url: "https://www.fcc.gov/node/215906",
       what_it_does: "No correction procedure existed; 38 minutes passed before a correction reached phones. Pre-scripted correction messages were recommended.",
       fit_note: "Cameroon can prepare correction templates before any AI alert goes live.", binding: false}
    - {jurisdiction: International, instrument: "Recommendation ITU-T X.1303 (CAP 1.2)", doc_id: GL-S10, url: "https://www.itu.int/rec/T-REC-X.1303",
       what_it_does: "Update and cancel message types let a wrong alert be corrected or withdrawn in a standard way.", fit_note: "Free to adopt.", binding: false}
  public_communication_after_error:
    - {jurisdiction: United States, instrument: "FCC findings on the Hawaii false missile alert (2018)", doc_id: GL-S06, url: "https://www.fcc.gov/node/215906",
       what_it_does: "Social media corrected the alert faster than the official system, showing the need for a planned public explanation.", fit_note: "Name a spokesperson in the plan.", binding: false}
  liability_alert_harm:
    - {jurisdiction: United States, instrument: "WARN Act (2006)", doc_id: GL-S05, url: "https://www.ecfr.gov/current/title-47/chapter-I/subchapter-A/part-10",
       what_it_does: "Limits the liability of operators that transmit alerts in good faith.",
       fit_note: "Protects operators but does not say who compensates victims; Cameroon would need to decide both."}
    - {jurisdiction: European Union, instrument: "Regulation (EU) 2024/1689 (AI Act)", article: "Articles 26 and 73", doc_id: GL-S02, url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj",
       what_it_does: "Sets obligations for AI providers and deployers, including monitoring and serious-incident reporting, which help establish who failed.",
       fit_note: "Liability for damages itself is left to other EU and national rules."}
  block_spoofed_alert:
    - {jurisdiction: United States, instrument: "47 CFR Part 10 (Wireless Emergency Alerts)", doc_id: GL-S05, url: "https://www.ecfr.gov/current/title-47/chapter-I/subchapter-A/part-10",
       what_it_does: "Only authorised alerting authorities can originate alerts through a single national gateway, which limits imitation.",
       fit_note: "Cameroon could designate one authenticated originator and a short code for official alerts."}
    - {jurisdiction: International, instrument: "Recommendation ITU-T X.1303 (CAP 1.2)", doc_id: GL-S10, url: "https://www.itu.int/rec/T-REC-X.1303",
       what_it_does: "Alerts carry an identified sender and can be digitally signed.", fit_note: "Free to adopt.", binding: false}
  multilingual_alerting:
    - {jurisdiction: International, instrument: "Recommendation ITU-T X.1303 (CAP 1.2)", doc_id: GL-S10, url: "https://www.itu.int/rec/T-REC-X.1303",
       what_it_does: "One alert can carry several info blocks, each in a different language.", fit_note: "Pre-translated templates for local languages.", binding: false}
    - {jurisdiction: Mauritius, instrument: "Common Alerting Protocol adoption (2023)", doc_id: GL-S08, url: "https://www.preventionweb.net/quick/96844",
       what_it_does: "Alerts reach people through many channels, including radio and sirens.", fit_note: "An African example.", binding: false}
  reach_unconnected:
    - {jurisdiction: Japan, instrument: "J-Alert, National Instantaneous Warning System", doc_id: GL-S07, url: "https://www.city.inagi.tokyo.jp/en/kurashi/iza/1002270/1010142/1012096.html",
       what_it_does: "Automatically triggers municipal radio and outdoor loudspeakers, reaching people without phones.", fit_note: "Community radio and loudspeakers exist in many Cameroonian towns.", binding: false}
    - {jurisdiction: International, instrument: "Early Warnings for All (ITU pillar)", doc_id: GL-S09, url: "https://wmo.int/resources/wmo-bulletin/wmo-bulletin-vol-72-1-2023/overview-of-early-warnings-all-executive-action-plan-2023-2027",
       what_it_does: "Uses AI and satellite imagery to map unconnected populations, and promotes multi-channel alerting.", fit_note: "ITU support is available to Cameroon.", binding: false}
    - {jurisdiction: International, instrument: "Sendai Framework, target G", doc_id: GL-S15, url: "https://www.undrr.org/publication/sendai-framework-disaster-risk-reduction-2015-2030",
       what_it_does: "Commits states to increase access to early warnings for all people by 2030.", fit_note: "Cameroon has endorsed the Sendai Framework.", binding: false}
  access_location_data:
    - {jurisdiction: European Union, instrument: "Regulation (EU) 2016/679 (GDPR) and Directive 2002/58/EC", article: "GDPR Articles 6(1)(e), 9(2)(i), Recital 46; ePrivacy Article 9", doc_id: GL-S03, url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj",
       what_it_does: "Allows processing for public health and humanitarian emergencies on a legal basis with safeguards; location data must be anonymised or based on consent unless restricted by law.",
       fit_note: "Cameroon's Law 2024/017 could be complemented by an emergency-use rule with safeguards and an end date."}
    - {jurisdiction: International, instrument: "WHO, Ethics and governance of AI for health (2021)", doc_id: GL-S13, url: "https://www.who.int/publications/i/item/9789240029200",
       what_it_does: "Protect autonomy and ensure accountability when health data and AI are used.", fit_note: "Guidance, not binding.", binding: false}
  protect_personal_data:
    - {jurisdiction: European Union, instrument: "Regulation (EU) 2016/679 (GDPR)", article: "Article 6", doc_id: GL-S03, url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj",
       what_it_does: "Lists the lawful bases for processing, including vital interests and public interest.", fit_note: "Useful model for an emergency basis."}
  authorise_transfer_abroad:
    - {jurisdiction: European Union, instrument: "Regulation (EU) 2016/679 (GDPR)", article: "Articles 45, 46 and 49", doc_id: GL-S03, url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj",
       what_it_does: "Transfers allowed with adequacy, safeguards, or derogations for important public interest and vital interests, without case-by-case prior authorisation.",
       fit_note: "Cameroon's prior-authorisation model needs a fast emergency track if the authority is not ready."}
    - {jurisdiction: African Union, instrument: "Malabo Convention (2014)", doc_id: GL-S11, url: "https://au.int/en/treaties/african-union-convention-cyber-security-and-personal-data-protection",
       what_it_does: "Requires an independent national data protection authority and adequate protection before transfers to non-member states.",
       fit_note: "Regional baseline for Cameroon."}
    - {jurisdiction: United Arab Emirates, instrument: "Federal Decree by Law No. (45) of 2021 (PDPL)", doc_id: AE-S01, url: "https://uaelegislation.gov.ae/en/legislations/1972",
       what_it_does: "Transfers allowed to adequate countries and in listed cases, without prior authorisation for each transfer.",
       fit_note: "The UAE twin shows a lighter procedure."}
  cross_border_agreement:
    - {jurisdiction: European Union, instrument: "Regulation (EU) 2016/679 (GDPR)", article: "Article 46", doc_id: GL-S03, url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj",
       what_it_does: "Standard contractual clauses bind foreign processors to protection rules.",
       fit_note: "Cameroon could require standard clauses in every AI purchase contract."}
    - {jurisdiction: African Union, instrument: "Malabo Convention (2014)", doc_id: GL-S11, url: "https://au.int/en/treaties/african-union-convention-cyber-security-and-personal-data-protection",
       what_it_does: "Sets conditions for transfers outside member states.", fit_note: "Regional baseline."}
  cholera_response:
    - {jurisdiction: International, instrument: "WHO International Health Regulations (2005)", article: "Article 6", doc_id: GL-S14, url: "https://www.who.int/publications/i/item/9789241580496",
       what_it_does: "Notify WHO within 24 hours of assessing a possible public health emergency of international concern.", fit_note: "Binding on Cameroon and the UAE."}
  issue_weather_warning:
    - {jurisdiction: Mauritius, instrument: "Common Alerting Protocol adoption (2023)", doc_id: GL-S08, url: "https://www.preventionweb.net/quick/96844",
       what_it_does: "Clear roles: the meteorological service issues, the disaster centre coordinates, the ICT authority disseminates.", fit_note: "An African example.", binding: false}
    - {jurisdiction: Philippines, instrument: "Republic Act No. 10639", article: "Section 4", doc_id: GL-S04, url: "https://issuances-library.senate.gov.ph/sites/default/files/2023-02/ra%252010639.pdf",
       what_it_does: "Names the agencies whose information makes up the alerts.", fit_note: "Naming one lead per hazard avoids overlaps."}
  decide_public_alert:
    - {jurisdiction: Japan, instrument: "J-Alert", doc_id: GL-S07, url: "https://www.city.inagi.tokyo.jp/en/kurashi/iza/1002270/1010142/1012096.html",
       what_it_does: "For some hazards the national government pushes alerts automatically, removing delays in local decisions.", fit_note: "Useful for fast-onset hazards.", binding: false}
    - {jurisdiction: United States, instrument: "47 CFR Part 10 (Wireless Emergency Alerts)", doc_id: GL-S05, url: "https://www.ecfr.gov/current/title-47/chapter-I/subchapter-A/part-10",
       what_it_does: "Only authorised alerting authorities may originate alerts.", fit_note: "Cameroon could name the authorised originators per hazard."}
  act_on_local_warning:
    - {jurisdiction: International, instrument: "Early Warnings for All", doc_id: GL-S09, url: "https://wmo.int/resources/wmo-bulletin/wmo-bulletin-vol-72-1-2023/overview-of-early-warnings-all-executive-action-plan-2023-2027",
       what_it_does: "People-centred warning systems include community observations and feedback.", fit_note: "Formalise a channel from village chiefs to the crisis committee.", binding: false}
  evacuate_zone:
    - {jurisdiction: Japan, instrument: "J-Alert", doc_id: GL-S07, url: "https://www.city.inagi.tokyo.jp/en/kurashi/iza/1002270/1010142/1012096.html",
       what_it_does: "Pre-defined local channels carry evacuation instructions.", fit_note: "Pre-defined evacuation areas speed decisions.", binding: false}
  accountability_report:
    - {jurisdiction: European Union, instrument: "Regulation (EU) 2024/1689 (AI Act)", article: "Articles 12 and 73", doc_id: GL-S02, url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj",
       what_it_does: "Logs and serious-incident reports make it possible to reconstruct who did what.",
       fit_note: "ALERTE's logbook shows the same idea in practice."}
  authorise_automatic_ai_alert:
    - {jurisdiction: European Union, instrument: "Regulation (EU) 2024/1689 (AI Act)", article: "Articles 14 and 26", doc_id: GL-S02, url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj",
       what_it_does: "High-risk AI must allow effective human oversight and guard against over-reliance; deployers assign competent people to oversee it.",
       fit_note: "Automatic release without a human step would need an explicit legal basis and safeguards."}
    - {jurisdiction: United States, instrument: "FCC findings on the Hawaii false missile alert (2018)", doc_id: GL-S06, url: "https://www.fcc.gov/node/215906",
       what_it_does: "Recommended second-person verification before any live alert is released.",
       fit_note: "Speed gained by removing the check is the risk the Hawaii case illustrates.", binding: false}
by_gap_type:
  G8:
    - {jurisdiction: European Union, instrument: "Regulation (EU) 2024/1689 (AI Act)", article: "Annex III point 5(d)", doc_id: GL-S02, url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj",
       what_it_does: "AI used to dispatch or prioritise emergency first response is classed as high-risk, with oversight and logging duties.",
       fit_note: "Cameroon could list AI used in public warning as high-risk."}
  # --- added for the core profile: every gap type gets at least two examples from different jurisdictions.
  # Notes below are written for any jurisdiction facing the same gap.
  G1:
    - {jurisdiction: European Union, instrument: "Directive (EU) 2018/1972 (European Electronic Communications Code)", article: "Article 110", doc_id: GL-S01, url: "https://eur-lex.europa.eu/eli/dir/2018/1972/oj",
       what_it_does: "Mobile operators must relay public warnings from the national public warning system to the end-users concerned.",
       fit_note: "A decree or regulator decision could create the same duty and name the authority that originates the warning."}
    - {jurisdiction: Philippines, instrument: "Republic Act No. 10639, Free Mobile Disaster Alerts Act (2014)", article: "Sections 4 and 6", doc_id: GL-S04, url: "https://issuances-library.senate.gov.ph/sites/default/files/2023-02/ra%252010639.pdf",
       what_it_does: "Operators must send free alerts with content from named agencies; fines and franchise suspension for non-compliance.",
       fit_note: "Requires naming content providers and setting penalties."}
  G2:
    - {jurisdiction: Mauritius, instrument: "Common Alerting Protocol adoption (2023)", doc_id: GL-S08, url: "https://www.preventionweb.net/quick/96844",
       what_it_does: "Clear roles: the weather service issues, the disaster centre coordinates, the ICT authority disseminates, with one common alert format.",
       fit_note: "Naming one lead per step avoids two bodies claiming the same decision.", binding: false}
    - {jurisdiction: United States, instrument: "47 CFR Part 10 (Wireless Emergency Alerts)", doc_id: GL-S05, url: "https://www.ecfr.gov/current/title-47/chapter-I/subchapter-A/part-10",
       what_it_does: "Separates who originates alerts (authorised authorities), the national gateway, and the operators who transmit them.",
       fit_note: "A list of authorised originators per hazard settles who may decide."}
    - {jurisdiction: Japan, instrument: "J-Alert, National Instantaneous Warning System", doc_id: GL-S07, url: "https://www.city.inagi.tokyo.jp/en/kurashi/iza/1002270/1010142/1012096.html",
       what_it_does: "The national government pushes urgent warnings automatically to all local channels.",
       fit_note: "Useful for fast-onset hazards where local decisions would add delay.", binding: false}
  G3:
    - {jurisdiction: European Union, instrument: "Regulation (EU) 2024/1689 (AI Act)", article: "Articles 14 and 26", doc_id: GL-S02, url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj",
       what_it_does: "High-risk AI must allow effective human oversight, and deployers must assign competent people to oversee it.",
       fit_note: "A named person validating an AI-drafted alert before release can be required without adopting the whole Act."}
    - {jurisdiction: United States, instrument: "FCC findings on the Hawaii false missile alert (2018)", doc_id: GL-S06, url: "https://www.fcc.gov/node/215906",
       what_it_does: "Recommended second-person verification before any live alert is released and pre-scripted correction procedures.",
       fit_note: "A simple procedure rule, cheap to adopt.", binding: false}
    - {jurisdiction: Mauritius, instrument: "Common Alerting Protocol adoption (2023)", doc_id: GL-S08, url: "https://www.preventionweb.net/quick/96844",
       what_it_does: "Written roles between the weather service, disaster agency and regulator, and one message format.",
       fit_note: "Writing the procedure down is the first step.", binding: false}
  G6:
    - {jurisdiction: United States, instrument: "WARN Act (2006)", doc_id: GL-S05, url: "https://www.ecfr.gov/current/title-47/chapter-I/subchapter-A/part-10",
       what_it_does: "Limits the liability of operators that transmit alerts in good faith.",
       fit_note: "Protects operators but does not say who compensates victims; both questions need an answer."}
    - {jurisdiction: European Union, instrument: "Regulation (EU) 2024/1689 (AI Act)", article: "Articles 26 and 73", doc_id: GL-S02, url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj",
       what_it_does: "Sets obligations for AI providers and deployers, including monitoring and serious-incident reporting, which help establish who failed.",
       fit_note: "Liability for damages itself is left to other rules."}
  G7:
    - {jurisdiction: International, instrument: "Recommendation ITU-T X.1303 (CAP 1.2)", doc_id: GL-S10, url: "https://www.itu.int/rec/T-REC-X.1303",
       what_it_does: "One alert can carry several info blocks, each in a different language.",
       fit_note: "Pre-translated templates for the languages actually spoken.", binding: false}
    - {jurisdiction: Mauritius, instrument: "Common Alerting Protocol adoption (2023)", doc_id: GL-S08, url: "https://www.preventionweb.net/quick/96844",
       what_it_does: "Alerts reach people through many channels, including radio and sirens.",
       fit_note: "Channels that do not need a smartphone widen reach.", binding: false}
    - {jurisdiction: Japan, instrument: "J-Alert, National Instantaneous Warning System", doc_id: GL-S07, url: "https://www.city.inagi.tokyo.jp/en/kurashi/iza/1002270/1010142/1012096.html",
       what_it_does: "Triggers municipal radio and outdoor loudspeakers automatically, reaching people without phones.",
       fit_note: "Loudspeakers and radio reach people phones miss.", binding: false}
  G9:
    - {jurisdiction: United States, instrument: "47 CFR Part 10 (Wireless Emergency Alerts)", doc_id: GL-S05, url: "https://www.ecfr.gov/current/title-47/chapter-I/subchapter-A/part-10",
       what_it_does: "Only authorised alerting authorities can originate alerts through a single national gateway, which limits imitation.",
       fit_note: "One authenticated originator makes copies easier to spot."}
    - {jurisdiction: International, instrument: "Recommendation ITU-T X.1303 (CAP 1.2)", doc_id: GL-S10, url: "https://www.itu.int/rec/T-REC-X.1303",
       what_it_does: "Alerts carry an identified sender and can be digitally signed.",
       fit_note: "Free to adopt.", binding: false}
