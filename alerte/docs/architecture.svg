<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" width="100%" role="img" aria-label="ALERTE architecture on the ITU-T Y.3172 pipeline" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="1500" height="1010" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="30" y="40" font-size="22" font-weight="800" fill="#0f172a">ALERTE · architecture on the ITU-T Y.3172 pipeline</text><text x="30" y="62" font-size="13" fill="#475569">Crisis-drill simulator for AI-assisted public alerting · fictional scenarios · runs offline on Windows, macOS, Linux · open source (MIT)</text><rect x="20" y="100" width="1460" height="112" rx="14" fill="#e0f2fe" fill-opacity=".55" stroke="#0ea5e9" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="32" y="88" width="38" height="24" rx="12" fill="#0ea5e9"/><text x="39" y="105" font-size="13" font-weight="700" fill="#fff">SRC</text><text x="80" y="105" font-size="13" font-weight="600" fill="#334155">Sources (documents and events)</text><rect x="40" y="118" width="268" height="84" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="174.0" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">National texts</text><text x="174.0" y="156" text-anchor="middle" font-size="11" fill="#475569">UAE (primary), Cameroon</text><text x="174.0" y="171" text-anchor="middle" font-size="11" fill="#475569">laws, decrees, plans (official /</text><text x="174.0" y="186" text-anchor="middle" font-size="11" fill="#475569">summary / not_found)</text><rect x="328" y="118" width="268" height="84" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="462.0" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Global precedents</text><text x="462.0" y="156" text-anchor="middle" font-size="11" fill="#475569">EU Code Art.110, AI Act, PH RA 10639,</text><text x="462.0" y="171" text-anchor="middle" font-size="11" fill="#475569">US 47 CFR 10, Hawaii 2018, JP J-Alert,</text><text x="462.0" y="186" text-anchor="middle" font-size="11" fill="#475569">Mauritius CAP, NIST AI RMF</text><rect x="616" y="118" width="268" height="84" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="750.0" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">ITU texts</text><text x="750.0" y="156" text-anchor="middle" font-size="11" fill="#475569">Y.3172, X.1303 (CAP),</text><text x="750.0" y="171" text-anchor="middle" font-size="11" fill="#475569">AI Readiness Report 2.0,</text><text x="750.0" y="186" text-anchor="middle" font-size="11" fill="#475569">hackathon requirements</text><rect x="904" y="118" width="268" height="84" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="1038.0" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">ITU reference corpus</text><text x="1038.0" y="156" text-anchor="middle" font-size="11" fill="#475569">seed documents of</text><text x="1038.0" y="171" text-anchor="middle" font-size="11" fill="#475569">CrashingGuru/ITUAIReadiness</text><text x="1038.0" y="186" text-anchor="middle" font-size="11" fill="#475569">(auto-detected, optional)</text><rect x="1192" y="118" width="268" height="84" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="1326.0" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Scenario injects</text><text x="1326.0" y="156" text-anchor="middle" font-size="11" fill="#475569">12 timed events, 2 acts + stress test</text><text x="1326.0" y="171" text-anchor="middle" font-size="11" fill="#475569">fictional HydroSense model card</text><text x="1326.0" y="186" text-anchor="middle" font-size="11" fill="#475569">role cards, who-does-what map</text><rect x="20" y="250" width="1460" height="128" rx="14" fill="#dcfce7" fill-opacity=".55" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="32" y="238" width="62" height="24" rx="12" fill="#22c55e"/><text x="39" y="255" font-size="13" font-weight="700" fill="#fff">C · PP</text><text x="104" y="255" font-size="13" font-weight="600" fill="#334155">Collector and pre-processor  →  knowledge base</text><rect x="40" y="268" width="268" height="92" rx="10" fill="#fff" stroke="#14b8a6" stroke-width="2"/><text x="174.0" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Collector</text><text x="174.0" y="306" text-anchor="middle" font-size="11" fill="#475569">manifest.csv + EVERY file in data/docs</text><text x="174.0" y="321" text-anchor="middle" font-size="11" fill="#475569">(any folder), extra folders, upload</text><text x="174.0" y="336" text-anchor="middle" font-size="11" fill="#475569">dedupe by SHA-256 · none skipped</text><rect x="328" y="268" width="268" height="92" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="462.0" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Read (knowledge/extract/)</text><text x="462.0" y="306" text-anchor="middle" font-size="11" fill="#475569">digital: exact text layer + tables</text><text x="462.0" y="321" text-anchor="middle" font-size="11" fill="#475569">scans: clean-up, 2-3 OCR passes, cells</text><text x="462.0" y="336" text-anchor="middle" font-size="11" fill="#475569">pictures with text · Word · Excel</text><path d="M308,314 L328,314" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><rect x="616" y="268" width="268" height="92" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="750.0" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Chunk by article</text><text x="750.0" y="306" text-anchor="middle" font-size="11" fill="#475569">country, type, article, language,</text><text x="750.0" y="321" text-anchor="middle" font-size="11" fill="#475569">institutions, topics, evidence tag,</text><text x="750.0" y="336" text-anchor="middle" font-size="11" fill="#475569">how read: text layer / OCR % / human</text><path d="M596,314 L616,314" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><rect x="904" y="268" width="268" height="92" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="1038.0" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Embed (optional)</text><text x="1038.0" y="306" text-anchor="middle" font-size="11" fill="#475569">none = BM25 + FR/EN bridge</text><text x="1038.0" y="321" text-anchor="middle" font-size="11" fill="#475569">Ollama bge-m3 · fastembed</text><text x="1038.0" y="336" text-anchor="middle" font-size="11" fill="#475569">OpenAI-compatible</text><path d="M884,314 L904,314" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><rect x="1192" y="268" width="268" height="92" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="1326.0" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Knowledge base</text><text x="1326.0" y="306" text-anchor="middle" font-size="11" fill="#475569">index/ chunks + BM25 + vectors</text><text x="1326.0" y="321" text-anchor="middle" font-size="11" fill="#475569">review queue → human proofread</text><text x="1326.0" y="336" text-anchor="middle" font-size="11" fill="#475569">export-chroma → ITU ChromaDB</text><path d="M1172,314 L1192,314" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><path d="M174,202 L174,268" fill="none" stroke="#0ea5e9" stroke-width="2" marker-end="url(#ah)"/><path d="M462,202 L462,268" fill="none" stroke="#0ea5e9" stroke-width="2" marker-end="url(#ah)"/><path d="M750,202 L750,268" fill="none" stroke="#0ea5e9" stroke-width="2" marker-end="url(#ah)"/><path d="M1038,202 L1038,268" fill="none" stroke="#0ea5e9" stroke-width="2" marker-end="url(#ah)"/><path d="M1326,202 L1326,268" fill="none" stroke="#0ea5e9" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="418" width="1460" height="250" rx="14" fill="#fef3c7" fill-opacity=".55" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="32" y="406" width="54" height="24" rx="12" fill="#f59e0b"/><text x="39" y="423" font-size="13" font-weight="700" fill="#fff">M · P</text><text x="96" y="423" font-size="13" font-weight="600" fill="#334155">Model layer (agents)  and  policy layer (checks)</text><rect x="40" y="440" width="270" height="210" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="175.0" y="460" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">LLM gateway (one AI door)</text><text x="175.0" y="478" text-anchor="middle" font-size="11" fill="#475569">sim/llm_client.py · every call logged</text><text x="175.0" y="493" text-anchor="middle" font-size="11" fill="#475569">retries, JSON repair, fallback</text><text x="175.0" y="508" text-anchor="middle" font-size="11" fill="#475569"></text><text x="175.0" y="523" text-anchor="middle" font-size="11" fill="#475569">OFFLINE rule brain (default)</text><text x="175.0" y="538" text-anchor="middle" font-size="11" fill="#475569">Ollama · vLLM · llama.cpp</text><text x="175.0" y="553" text-anchor="middle" font-size="11" fill="#475569">LM Studio · ITU sandbox</text><text x="175.0" y="568" text-anchor="middle" font-size="11" fill="#475569">LoRA fine-tune (sandbox/)</text><rect x="340" y="440" width="560" height="210" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="620" y="460" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Six agents · private inbox · mandate-filtered retrieval</text><text x="620" y="476" text-anchor="middle" font-size="10.5" fill="#92400e">AI mode: each reasons from its own perspective, asks, objects, agrees · rule-engine mode: labelled templates, no AI</text><circle cx="390" cy="515" r="31" fill="#fffbeb" stroke="#1d4ed8" stroke-width="2.6"/><text x="390" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">MET</text><text x="390" y="562" text-anchor="middle" font-size="10.5" fill="#475569">weather</text><circle cx="470" cy="515" r="31" fill="#fffbeb" stroke="#1d4ed8" stroke-width="2.6"/><text x="470" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">DPC</text><text x="470" y="562" text-anchor="middle" font-size="10.5" fill="#475569">civil protection</text><circle cx="550" cy="515" r="31" fill="#fffbeb" stroke="#1d4ed8" stroke-width="2.6"/><text x="550" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">OPS</text><text x="550" y="562" text-anchor="middle" font-size="10.5" fill="#475569">operator</text><circle cx="630" cy="515" r="31" fill="#fffbeb" stroke="#1d4ed8" stroke-width="2.6"/><text x="630" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">ART</text><text x="630" y="562" text-anchor="middle" font-size="10.5" fill="#475569">regulator</text><circle cx="710" cy="515" r="31" fill="#fffbeb" stroke="#1d4ed8" stroke-width="2.6"/><text x="710" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">ANTIC</text><text x="710" y="562" text-anchor="middle" font-size="10.5" fill="#475569">security</text><circle cx="810" cy="515" r="31" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.6"/><text x="810" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">LEGAL</text><text x="810" y="562" text-anchor="middle" font-size="10.5" fill="#475569">adviser</text><circle cx="860" cy="600" r="0" /><rect x="358" y="582" width="262" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-dasharray="5 3"/><text x="489" y="603" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">HydroSense (fictional AI under test)</text><text x="489" y="621" text-anchor="middle" font-size="10.5" fill="#92400e">scripted: fails on cue, model card: ≥5 of 7 sensors</text><text x="640" y="596" font-size="10.5" fill="#475569">4 tools: search · ask LEGAL · post · decide</text><text x="640" y="612" font-size="10.5" fill="#475569">decision record: known, unknown, options,</text><text x="640" y="627" font-size="10.5" fill="#475569">choice, legal basis, confidence</text><rect x="930" y="440" width="530" height="210" rx="10" fill="#fff" stroke="#ef4444" stroke-width="2"/><text x="1195.0" y="460" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Policy layer (rules, not opinions)</text><text x="1195.0" y="478" text-anchor="middle" font-size="11" fill="#475569">Mandate map: who may / must do what (powers, duties, leads)</text><text x="1195.0" y="493" text-anchor="middle" font-size="11" fill="#475569">each line: article + evidence (documented / inferred / assumed)</text><text x="1195.0" y="508" text-anchor="middle" font-size="11" fill="#475569"></text><text x="1195.0" y="523" text-anchor="middle" font-size="11" fill="#475569">Citation checker: rejects articles or quotes not in the library</text><text x="1195.0" y="538" text-anchor="middle" font-size="11" fill="#475569">Gap rules G1 G2 G3 G6 G7 G8 G9 → severity, confidence</text><text x="1195.0" y="553" text-anchor="middle" font-size="11" fill="#475569">Precedent library: ≥2 jurisdictions per gap</text><text x="1195.0" y="568" text-anchor="middle" font-size="11" fill="#475569">Readiness scorecard: ITU Report 2.0, 13 dimensions</text><path d="M310,545 L340,545" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah)"/><path d="M900,545 L930,545" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#ah)"/><path d="M1195,378 L1195,440" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#ah)"/><text x="1199.0" y="405.0" font-size="10.5" fill="#22c55e" font-style="italic">retrieval</text><path d="M620,378 L620,440" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#ah)"/><text x="624.0" y="405.0" font-size="10.5" fill="#22c55e" font-style="italic">passages (filtered)</text><rect x="20" y="708" width="1460" height="96" rx="14" fill="#ede9fe" fill-opacity=".55" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="32" y="696" width="78" height="24" rx="12" fill="#8b5cf6"/><text x="39" y="713" font-size="13" font-weight="700" fill="#fff">D · MLFO</text><text x="120" y="713" font-size="13" font-weight="600" fill="#334155">Distributor (coordination board)  and  orchestrator (drill engine)</text><rect x="40" y="724" width="520" height="72" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="2"/><text x="300.0" y="744" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Coordination board · 6 message types</text><text x="300.0" y="762" text-anchor="middle" font-size="11" fill="#475569">INFO · REQUEST · ANSWER · DECISION · OBJECTION · GAP_FLAG</text><text x="300.0" y="777" text-anchor="middle" font-size="11" fill="#475569">no agent reads another inbox · max 2 rounds per inject</text><rect x="580" y="724" width="880" height="72" rx="10" fill="#fff" stroke="#475569" stroke-width="2"/><text x="1020.0" y="744" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">MLFO: Drill engine (sim/engine.py)</text><text x="1020.0" y="762" text-anchor="middle" font-size="11" fill="#475569">config: country · scenario · mode · brain · language · humans · autopilot / replay / pause / surprise inject</text><text x="1020.0" y="777" text-anchor="middle" font-size="11" fill="#475569">budget: ≤2 rounds per inject · ≤150 model calls · simulated clock · human-seat forms</text><path d="M620,668 L620,724" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ah)"/><text x="624.0" y="692.0" font-size="10.5" fill="#8b5cf6" font-style="italic">messages</text><rect x="20" y="842" width="1460" height="92" rx="14" fill="#fce7f3" fill-opacity=".55" stroke="#ec4899" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="32" y="830" width="46" height="24" rx="12" fill="#ec4899"/><text x="39" y="847" font-size="13" font-weight="700" fill="#fff">SINK</text><text x="88" y="847" font-size="13" font-weight="600" fill="#334155">Outputs</text><rect x="40" y="856" width="268" height="70" rx="10" fill="#fff" stroke="#ec4899" stroke-width="2"/><text x="174.0" y="876" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Streamlit interface</text><text x="174.0" y="894" text-anchor="middle" font-size="11" fill="#475569">agent arena · live exercise · decisions</text><text x="174.0" y="909" text-anchor="middle" font-size="11" fill="#475569">gap report · replay · adviser · readiness</text><rect x="328" y="856" width="268" height="70" rx="10" fill="#fff" stroke="#ec4899" stroke-width="2"/><text x="462.0" y="876" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Reports</text><text x="462.0" y="894" text-anchor="middle" font-size="11" fill="#475569">HTML + Markdown + JSON</text><text x="462.0" y="909" text-anchor="middle" font-size="11" fill="#475569">gap report, timeline, assumptions</text><rect x="616" y="856" width="268" height="70" rx="10" fill="#fff" stroke="#ec4899" stroke-width="2"/><text x="750.0" y="876" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Open knowledge</text><text x="750.0" y="894" text-anchor="middle" font-size="11" fill="#475569">ChromaDB export (ITU format)</text><text x="750.0" y="909" text-anchor="middle" font-size="11" fill="#475569">contribution to the ITU open asset</text><rect x="904" y="856" width="268" height="70" rx="10" fill="#fff" stroke="#ec4899" stroke-width="2"/><text x="1038.0" y="876" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Fine-tuning data</text><text x="1038.0" y="894" text-anchor="middle" font-size="11" fill="#475569">export-sft → LoRA</text><text x="1038.0" y="909" text-anchor="middle" font-size="11" fill="#475569">(sandbox GPU credits)</text><rect x="1192" y="856" width="268" height="70" rx="10" fill="#fff" stroke="#ec4899" stroke-width="2"/><text x="1326.0" y="876" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Notifications</text><text x="1326.0" y="894" text-anchor="middle" font-size="11" fill="#475569">Slack webhook (optional)</text><text x="1326.0" y="909" text-anchor="middle" font-size="11" fill="#475569">run summary</text><path d="M1000,796 L1000,856" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="948" width="1460" height="50" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="750" y="970" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">SANDBOX = the whole simulator · SHA-256 hash-chained ledger (ledger.jsonl)</text><text x="750" y="988" text-anchor="middle" font-size="11" fill="#115e59">records events, retrievals, model calls, messages, decisions, citation checks, gaps, expert reviews · replay without calling the AI · verify button detects any edit</text></svg>